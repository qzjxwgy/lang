<header><div class="wrap">
<h1>QS99 留学语言要求查询</h1>
<div class="sub">95 所院校 · 封闭清单 94 · 语言班价格 33 · 构建 17:06:59 · <span style="color:#ffd166">草稿待核</span></div>

<div class="wrap">
<div class="tabs">
<div class="tab on" data-t="lookup" onclick="setTab('lookup')">① 查院校</div>

<div id="lookup">

<div id="results"></div>
</div>

<div id="reverse" style="display:none">
<div class="rev-row">
<select id="rtest" onchange="renderRev()">
<option value="IELTS">IELTS</option>
<option value="TOEFL iBT(旧0-120)">TOEFL iBT (旧 0-120)</option>
<option value="TOEFL iBT(新1-6)">TOEFL iBT (新 1-6)</option>

</select>
<input id="rscore" type="number" step="0.5" placeholder="你的总分" oninput="renderRev()">
</div>
<div class="hint">输入你的成绩 → 列出该分数达标的院校(按最低门槛档比对)。这是反向选校。</div>
<div id="revresults"></div>
</div>

<div class="foot">
所有数据为机器采集草稿(待核-草稿),上线/对客前须人工或校代复核,尤其小众考试与价格。<br>

数据来源:各校官方页(每条附 source)。本工具离线运行,可直接发送演示。
</div>

uction in lieu of a test score. The separate discretionary exemption at L367 applies only to Korean-language TRAINING, not to the English score requirement. From Spring 2027 all applicants must submit official language scores (the prior KU online Korean level test is discontinued).", "niche_note: KU undergraduate accepts a closed two-test English list (TOEFL iBT, IELTS Academic) with explicit exclusions (TOEFL My Best Scores/Essential, IELTS Indicator). Niche tests are therefore treated as 不接受. PTE/Cambridge kept at 待核/NOT-listed per existing data; no niche-test brand (Duolingo/Trinity/LanguageCert/Oxford/OET) appears anywhere in the three reviewed source files."]}, {"label": "档", "applies": "Applicants seeking English-based major assignment in the College of International Studies (Global Open Major); also International Studies major requires English qualification as mandatory", "tests": {"IELTS": ["7.0", "None"]}, "niche": ["Trinity_ISE: 不接受 — English-track major assignment names ONLY IELTS 7.0 or TOEFL iBT 100 (or TOPIK 5 for Korean track) (ug_guide.txt L203-204). Trinity ISE not listed.", "LanguageCert: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track assignment (ug_guide.txt L203-204).", "Oxford_Advanced: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track assignment (ug_guide.txt L203-204).", "Duolingo: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track assignment (ug_guide.txt L203-204).", "OET: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track assignment (ug_guide.txt L203-204).", "TOEFL_ITP: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track major assignment; ITP not listed.", "TOEIC: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track major assignment; TOEIC not listed.", "Michigan: 不接受 — only IELTS 7.0 / TOEFL iBT 100 named for English-track major assignment; Michigan tests not listed.", "IELTS_One_Skill_Retake: 待核 — only the IELTS 7.0 overall threshold is named; One Skill Retake not addressed.", function setTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.getElementById('lookup').style.display = t==='lookup'?'':'none';
  document.getElementById('reverse').style.display = t==='reverse'?'':'none';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function schoolCard(s){
  let h = '<div class="card"><div class="sname">'+esc(s.name);
  if(s.verify==='clean') h += ' <span class="badge b-ok">✓ 已核验</span>';
  else if(s.verify==='needs_review') h += ' <span class="badge b-no">⚠ 待复核</span>';
  else if(s.verify==='minor') h += ' <span class="badge b-warn">~ 小瑕疵</span>';
  h += '</div>';
  h += '<div class="meta">'+esc(s.scheme||'')+' · <span class="badge b-warn">'+esc(s.conf||'待核')+'</span></div>';
  // closed list FIRST — the core value
  if(s.accepted.length||s.not_accepted.length){
    h += '<div class="sec-h">✅ 接受的考试</div><div>';
    h += s.accepted.length? s.accepted.map(t=>'<span class="chip c-ok">'+esc(t)+'</span>').join('') : '<span class="niche">待核</span>';
    h += '</div>';
    if(s.not_accepted.length){
      h += '<div class="sec-h">❌ 不接受 / 未列出</div><div>';
      h += s.not_accepted.map(t=>'<span class="chip c-no">'+esc(t)+'</span>').join('');
      h += '</div>';
    }
  }
  // bands
  if(s.bands.length){
    h += '<div class="sec-h">📊 各档分数要求</div>';
    s.bands.forEach(b=>{
      h += '<div class="bandbox"><div class="bandlabel">'+esc(b.label)+' <span class="applies">'+esc(b.applies||'')+'</span></div>';
      const keys=Object.keys(b.tests);
      if(keys.length){
        h += '<table><tr><th>考试</th><th>总分</th><th>单项最低</th></tr>';
        keys.forEach(k=>{h+='<tr><td>'+esc(k)+'</td><td>'+esc(b.tests[k][0])+'</td><td>'+esc(b.tests[k][1])+'</td></tr>'});
        h += '</table>';
      }
      if(b.niche.length) h += '<div class="niche">小众/豁免:'+b.niche.map(esc).join(' · ')+'</div>';
      h += '</div>';
    });
  }
  // pathway
  if(s.pathway.length){
    h += '<div class="sec-h">💷 语言班 / 价格</div>';
    s.pathway.forEach(p=>{
      h += '<div class="price"><b>'+esc(p.name)+'</b> ';
      if(p.weeks) h += esc(p.weeks)+'周 · ';
      if(p.fee) h += esc(p.fee);
      if(p.waives==='true'||p.waives===true||p.waives==='True') h += ' <span class="waive">✓ 读完免重考</span>';
      h += '</div>';
    });
  }
  if(s.src && s.src.indexOf('http')===0){
    h += '<a class="srcbtn" href="'+esc(s.src)+'" target="_blank" rel="noopener">🔗 查看官方来源</a>';
  } else if(s.src){
    h += '<div class="meta" style="margin-top:10px">来源:'+esc(s.src.slice(0,80))+'</div>';
  }
  h += '</div>';
  return h;
}
function normalize(str){
  // 全角→半角(输入法常把英文转全角),去所有空格,转小写
  return (str||'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0))
    .replace(/　/g,'').replace(/\s+/g,'').toLowerCase();
}
function render(){
  const q=normalize(document.getElementById('q').value);
  let list = DATA;
  if(q) list = DATA.filter(s=>normalize(s.name+s.dir+(s.alias||'')).includes(q));
  const el=document.getElementById('results');
  if(!list.length){el.innerHTML='<div class="empty">没找到匹配的院校</div>';return}
  if(!q){el.innerHTML='<div class="empty">↑ 输入院校名开始查询('+DATA.length+' 所)</div>';return}
  el.innerHTML = list.slice(0,30).map(function(s){
    try{ return schoolCard(s); }
    catch(e){ return '<div class="card"><div class="sname">'+esc(s.name)+'</div><div class="meta" style="color:#ff6b6b">该校卡片渲染出错:'+esc(e.message)+'(数据仍在,联系修复)</div></div>'; }
  }).join('');
}
function parseScore(v){const m=String(v).match(/[\d.]+/);return m?parseFloat(m[0]):null}
function renderRev(){
  const test=document.getElementById('rtest').value;
  const sc=parseFloat(document.getElementById('rscore').value);
  const el=document.getElementById('revresults');
  if(isNaN(sc)){el.innerHTML='<div class="empty">输入分数查看可达标院校</div>';return}
  const hits=[];
  DATA.forEach(s=>{
    let best=null;
    s.bands.forEach(b=>{const t=b.tests[test];if(t){const need=parseScore(t[0]);if(need!=null&&sc>=need){if(best==null||need<best)best=need}}});
    if(best!=null) hits.push({s,best});
  });
  hits.sort((a,b)=>b.best-a.best);
  if(!hits.length){el.innerHTML='<div class="empty">该分数暂无达标院校(或这些校未录该考试分数)</div>';return}
  el.innerHTML='<div class="hint">'+hits.length+' 所院校的最低档可用你这个分数达标:</div>'+
    hits.map(h=>'<div class="card"><span class="sname" style="font-size:15px">'+esc(h.s.name)+'</span>'+
      '<span class="chip c-ok" style="float:right">最低档 '+test+' '+h.best+'</span></div>').join('');
}
// 自检:页面加载时实跑一次 kcl 搜索,把结果显示在副标题,确认JS真在运行
try{
  const _t = DATA.filter(s=>normalize(s.name+s.dir+(s.alias||'')).includes('kcl'));
  const _badge = document.createElement('span');
  _badge.style.cssText='color:'+(_t.length?'#3ddc84':'#ff6b6b')+';font-size:11px';
  _badge.textContent = ' · 搜索自检:kcl→'+(_t.length?_t[0].name.slice(0,20)+' ✓':'失败');
  document.querySelector('.sub').appendChild(_badge);
  // 轮询输入框:不依赖任何事件,框里内容一变就重渲染(彻底防输入法/自动填充/事件丢失)
  let _last = null;
  setInterval(function(){
    const v = document.getElementById('q').value;
    if(v !== _last){ _last = v; render(); }
  }, 200);
}catch(e){
  const _b=document.createElement('div');
  _b.style.cssText='background:#511;color:#fbb;padding:8px;font-size:12px';
  _b.textContent='JS错误:'+e.message;
  document.body.prepend(_b);
}
render();
